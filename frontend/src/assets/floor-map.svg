<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <rect x="0" y="0" width="1200" height="480" fill="#fbfcfe" />

  <!-- 本社ビル -->
  <g>
    <rect x="60" y="40" width="700" height="400" rx="10" fill="#ffffff" stroke="#c7cde0" stroke-width="2" />
    <text x="80" y="70" font-family="'Segoe UI', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#1c2029">本社ビル</text>

    <!-- 1F ロビー横スペース -->
    <rect x="80" y="90" width="300" height="100" rx="8" fill="#e5f0fa" stroke="#2563a6" stroke-width="1.5" />
    <text x="100" y="120" font-family="sans-serif" font-size="14" font-weight="700" fill="#2563a6">1F</text>
    <text x="100" y="144" font-family="sans-serif" font-size="13" fill="#2563a6">ロビー横スペース</text>
    <text x="100" y="166" font-family="sans-serif" font-size="11" fill="#5a7fa0">応接コーナー1</text>

    <!-- 3F オープンエリア -->
    <rect x="400" y="90" width="340" height="150" rx="8" fill="#e3f6ec" stroke="#17845a" stroke-width="1.5" />
    <text x="420" y="120" font-family="sans-serif" font-size="14" font-weight="700" fill="#17845a">3F</text>
    <text x="420" y="144" font-family="sans-serif" font-size="13" fill="#17845a">オープンエリア</text>
    <text x="420" y="166" font-family="sans-serif" font-size="11" fill="#4d9a7c">オープンデスクA / B</text>
    <text x="420" y="184" font-family="sans-serif" font-size="11" fill="#4d9a7c">ラウンジソファ席</text>

    <!-- 5F 会議室ゾーン -->
    <rect x="80" y="210" width="660" height="200" rx="8" fill="#fdf1dd" stroke="#b4740e" stroke-width="1.5" />
    <text x="100" y="240" font-family="sans-serif" font-size="14" font-weight="700" fill="#b4740e">5F</text>
    <text x="100" y="264" font-family="sans-serif" font-size="13" fill="#b4740e">会議室ゾーン</text>
    <rect x="100" y="280" width="150" height="100" rx="6" fill="#ffffff" stroke="#e3c68a" />
    <text x="115" y="335" font-family="sans-serif" font-size="12" fill="#8a5c0a">会議室501</text>
    <rect x="270" y="280" width="150" height="100" rx="6" fill="#ffffff" stroke="#e3c68a" />
    <text x="285" y="335" font-family="sans-serif" font-size="12" fill="#8a5c0a">会議室502</text>
    <rect x="440" y="280" width="140" height="100" rx="6" fill="#ffffff" stroke="#e3c68a" />
    <text x="452" y="325" font-family="sans-serif" font-size="12" fill="#8a5c0a">個室ブース</text>
    <text x="452" y="342" font-family="sans-serif" font-size="12" fill="#8a5c0a">503 / 504</text>
  </g>

  <!-- 別館 -->
  <g>
    <rect x="800" y="40" width="340" height="400" rx="10" fill="#ffffff" stroke="#c7cde0" stroke-width="2" />
    <text x="820" y="70" font-family="sans-serif" font-size="20" font-weight="700" fill="#1c2029">別館</text>

    <rect x="820" y="90" width="300" height="310" rx="8" fill="#ebefff" stroke="#3454d1" stroke-width="1.5" />
    <text x="840" y="120" font-family="sans-serif" font-size="14" font-weight="700" fill="#3454d1">1F</text>
    <text x="840" y="144" font-family="sans-serif" font-size="13" fill="#3454d1">多目的スペース</text>
    <rect x="840" y="165" width="260" height="105" rx="6" fill="#ffffff" stroke="#b7c0f2" />
    <text x="855" y="222" font-family="sans-serif" font-size="12" fill="#2a3ea6">多目的ホールA</text>
    <rect x="840" y="285" width="260" height="95" rx="6" fill="#ffffff" stroke="#b7c0f2" />
    <text x="855" y="337" font-family="sans-serif" font-size="12" fill="#2a3ea6">多目的ホールB</text>
  </g>
</svg>
